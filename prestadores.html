 <script src="app.js"></script>

 <script>
   function openMenu(){ document.getElementById("menu").style.width = "250px"; }
   function closeMenu(){ document.getElementById("menu").style.width = "0"; }

   function renderPrestadores(filter){
     const container = document.getElementById('listaPrestadores');
     container.innerHTML = '';
     const usuarios = TXOVA.getUsuarios();
     const motoristas = usuarios.filter(u => (u.categoria||'').toLowerCase() === 'motorista');
     const list = motoristas.filter(m => {
       if(!filter) return true;
       const f = filter.toLowerCase();
       return (m.nome||'').toLowerCase().includes(f) || (m.contacto||'').includes(f);
     });

     list.forEach(motorista => {
       const card = document.createElement('div'); card.className='card';
       card.innerHTML = `<h3>${motorista.nome}</h3>
         <p>Contacto: ${motorista.contacto}</p>
         <p>Status: ${motorista.status||'—'}</p>
         <div class="actions"><button class="btn" onclick="chamarPrestador(${motorista.id})">Chamar</button></div>`;
       container.appendChild(card);
     });
   }

   function chamarPrestador(motoristaId){
     const usuarios = TXOVA.getUsuarios();
     const motorista = usuarios.find(u=>u.id===motoristaId);
     if(!motorista){ alert('Prestador inválido'); return; }
     localStorage.setItem('corridaAtiva', JSON.stringify({ motoristaId: motoristaId }));
     window.location.href = 'corrida.html';
   }

   document.addEventListener('DOMContentLoaded', function(){
     renderPrestadores();
     document.getElementById('btnFiltrar').addEventListener('click', function(){
       const v = document.getElementById('filtro').value||''; renderPrestadores(v);
     });
   });
 </script>
