<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Prestadores</title>
  <link rel="stylesheet" href="../TXOVA-Passageiros/prestadores.css">
</head>
<body>
  
     
 <header>
   <h2>Prestadores</h2>
   <span class ="menu-btn" onclick="openMenu()" >☰</span>
 </header>
  
 <h2 class="principal">Prestadores disponíveis</h2>

    <div id="menu" class="menu">
    <nav>
      <ul> 
        <li><a href="javascript:void(0)" onclick ="closeMenu()">Fechar</a></li>
         <li><a href="Txova html.html">In&iacute;cio</a></li>
        <li><a href="conta_passageiro.html">Minha Conta</a></li>
        <li><a href="historico.html">Hist&oacute;rico de corridas</a></li>
        <li><a href="configuracao.html">Configura&ccedil;&otilde;es</a></li>
      </ul>
    </nav>
    </div>

    <section id="listaPrestadores" class="container-cards">
        <!-- Os cards vão aparecer aqui via JS -->
    </section>

 <div class="footer">
    &copy; Desenvolvido por: Losesp Carlos Canipuela. <br>
    Contactos: e-mail: losespcarlos@gmail.com; <br>
    whatsapp: 848570501; <br>
    facebook: Losesp Canipuela.
  </div>
 
 <script>       
function openMenu(){
  document.getElementById("menu").style.width = "250px";
}
function closeMenu(){
  document.getElementById("menu").style.width = "0";
}


let lista = document.getElementById("listaPrestadores");

let usuarios = JSON.parse(localStorage.getItem("usuarios")) || [];

let motoristas = usuarios.filter(u => u.categoria && 
    u.categoria.toLowerCase() === 
    "motorista"
);

motoristas.forEach(motorista => {

 let card = document.createElement("div");
 card.className = "card";

 card.innerHTML = `
   <h3>${motorista.nome}</h3>
   <p>Distância: ${motorista.distancia}</p>
   <p>Status: ${motorista.status}</p>
   <button onclick="chamarPrestador('${motorista.contacto}')">
   Chamar Prestador
   </button>
 `;

 lista.appendChild(card);
});

function chamarPrestador(contacto){
 localStorage.setItem("corridaAtiva", contacto);
 window.location.href = "corrida.html";
}


 </script>
</body>
</html>
