  <main class="container content">
    <section class="preview">
      <h3>Nova Corrida</h3>
      <form id="novaCorridaForm">
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
          <div>
            <label for="motorista">Escolher prestador</label>
            <select id="motorista" required>
              <!-- preenchido por JS -->
            </select>
          </div>
          <div>
            <label for="tipo">Tipo de transporte</label>
            <input id="tipo" value="Táxi-carro" required />
          </div>
        </div>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px">
          <div>
            <label for="valor">Valor (MZN)</label>
            <input id="valor" type="number" step="0.01" value="0" required />
          </div>
          <div>
            <label for="observacao">Observação</label>
            <input id="observacao" placeholder="(opcional)" />
          </div>
        </div>
        <div style="margin-top:12px">
          <button type="submit" class="btn btn-iniciar">Chamar/Registrar Corrida</button>
        </div>
      </form>
    </section>

    <section style="margin-top:18px">
      <h3>Histórico</h3>
      <div id="historicoConteudo">
        <!-- corridas serão renderizadas aqui -->
      </div>
    </section>
  </main>

  <script src="app.js"></script>

  <script>
    function openMenu(){ document.getElementById("menu").style.width = "250px"; }
    function closeMenu(){ document.getElementById("menu").style.width = "0"; }

    function renderHistorico(){
      const container = document.getElementById('historicoConteudo');
      container.innerHTML = '';
      const corridas = TXOVA.getCorridas().slice().reverse();
      const usuarios = TXOVA.getUsuarios();
      const byDay = {};
      const today = new Date();

      corridas.forEach(c => {
        const d = new Date(c.inicio);
        const key = (d.toDateString() === today.toDateString()) ? 'Hoje'
          : (new Date(today.getFullYear(), today.getMonth(), today.getDate()-1).toDateString() === d.toDateString()) ? 'Ontem'
          : d.toLocaleDateString();
        if(!byDay[key]) byDay[key]=[];
        byDay[key].push(c);
      });

      Object.keys(byDay).forEach(day => {
        const h = document.createElement('h4'); h.textContent = day; container.appendChild(h);
        const wrap = document.createElement('div'); wrap.className='cards';
        byDay[day].forEach(c => {
          const user = usuarios.find(u=>u.id===c.userId) || {};
          const motorista = usuarios.find(u=>u.id===c.motoristaId) || {};
          const card = document.createElement('div'); card.className='card';
          card.innerHTML = `<h3>${c.tipo} — ${TXOVA.formatCurrency(c.valor)}</h3>
            <p><strong>Início:</strong> ${new Date(c.inicio).toLocaleString()}</p>
            <p><strong>Terminou:</strong> ${c.fim? new Date(c.fim).toLocaleString() : '—'}</p>
            <p><strong>Passageiro:</strong> ${user.nome||user.contacto||'—'}</p>
            <p><strong>Prestador:</strong> ${motorista.nome||motorista.contacto||'—'}</p>
            <p><strong>Estado:</strong> ${c.status||'—'}</p>`;
          wrap.appendChild(card);
        });
        container.appendChild(wrap);
      });
    }

    function populateMotoristas(){
      const sel = document.getElementById('motorista');
      sel.innerHTML = '';
      const usuarios = TXOVA.getUsuarios();
      const motoristas = usuarios.filter(u => (u.categoria||'').toLowerCase() === 'motorista');
      motoristas.forEach(m => {
        const opt = document.createElement('option'); opt.value = m.id; opt.textContent = `${m.nome} — ${m.contacto}`;
        sel.appendChild(opt);
      });
      if(motoristas.length===0){ const opt=document.createElement('option');opt.textContent='Nenhum prestador disponível';sel.appendChild(opt); }
    }

    document.addEventListener('DOMContentLoaded', function(){
      populateMotoristas();
      renderHistorico();

      document.getElementById('novaCorridaForm').addEventListener('submit', function(e){
        e.preventDefault();
        const usuario = TXOVA.getUsuarioLogado() || TXOVA.getUsuarios()[0];
        if(!usuario){ alert('Necessita iniciar sessão para criar corrida'); window.location.href='cadastro.html'; return; }
        const motoristaId = Number(document.getElementById('motorista').value) || null;
        const tipo = document.getElementById('tipo').value || 'Táxi-carro';
        const valor = Number(document.getElementById('valor').value) || 0;
        const nova = {
          userId: usuario.id,
          motoristaId: motoristaId,
          inicio: new Date().toISOString(),
          fim: new Date().toISOString(),
          valor: valor,
          tipo: tipo,
          status: 'concluida'
        };
        TXOVA.addCorrida(nova);
        renderHistorico();
        alert('Corrida registada com sucesso');
      });
    });
  </script>
